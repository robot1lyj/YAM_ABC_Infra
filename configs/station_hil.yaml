# Main YAM station: two official motorized leaders, two parallel-gripper followers.
# Two standard DM4310 linear follower grippers and the verified D405 roster.
# Runs unchanged with --mock; no GELLO zeroing or automatic arm homing.
robot:
  type: yam
  arm_type: yam
  num_arm_joints: 6
  leader_gripper_type: yam_teaching_handle
  bilateral_kp: 0.0
  robots:
    - {type: yam_left, gripper: linear_4310, gripper_limits: [0.62123, -5.04368], channel: can_left}
    - {type: yam_right, gripper: linear_4310, gripper_limits: [0.07038, -5.03948], channel: can_right}
  controllers:
    - {type: yam_lead_left, controls: yam_left, channel: can_lead_l}
    - {type: yam_lead_right, controls: yam_right, channel: can_lead_r}
cameras:
  - {name: top, role: top, type: realsense, serial: "260522275397", width: 640, height: 480, fps: 30}
  - {name: left, role: left, type: realsense, serial: "260522271298", width: 640, height: 480, fps: 30}
  - {name: right, role: right, type: realsense, serial: "260422271123", width: 640, height: 480, fps: 30}
control_hz: 30.0
save_root: data/episodes
task_name: pick and place
hil:
  # Model action sample interval; align with condapi training before hardware rollout.
  action_dt: 0.03333333333333333
  # Follower factory home is six zero arm joints, not encoder recalibration.
  # Leaders stay manual; retain both follower grippers.
  factory_zero_home: true
  # Live raw chunks disagreed by up to 1.15 rad at 2026-09-16 replans.
  # Same-target-time short smoothing suppresses the discontinuity; grippers
  # still take the newest prediction and their existing speed bound.
  policy_fusion: smooth
  smooth_steps: 8
  ensemble_chunks: 3
  ensemble_decay: 0.01
  max_frame_age: 0.5
  max_frame_skew: 0.12
  warn_frame_skew: 0.04
  max_state_age: 0.25
  leader_gain: 0.2
  leader_speed: 0.5
  # Manual tracking has no application-level slew limit, matching official GELLO.
  # This includes the grippers; policy and automatic paths retain their bounds.
  # Policy/automatic joint slew envelope, now aligned with upstream YAM's default.
  max_joint_speed: 1.5
  handover_error: 0.2
  mirror_error: 0.5
  # Normal replanning cadence: execute about ten 30Hz targets between requests.
  # The adaptive deadline may request earlier if the measured observation-to-ready
  # p95 plus reserve approaches the end of the usable action plan.
  replan_period: 0.3333333333333333
  expected_policy_latency: 0.2 # seed for total round trip; replaced by accepted-reply p95
  prefetch_margin: 0.067 # two 30Hz control periods of reserve
  request_timeout: 1.5
  action_timeout: 1.5
  tick_timeout: 0.5
